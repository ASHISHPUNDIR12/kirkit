name: Backend
on:
  push:
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kirkit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d kirkit_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kirkit_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kirkit_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run prisma:validate
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run prisma:deploy
      - run: npm run test:integration
      - run: docker build --target migrate -t kirkit-migrate .
      - run: docker build -t kirkit-backend .
