<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gully Cricket — Phone Preview</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px 12px;
        background: #e9ede7;
        color: #10281b;
        font-family: system-ui, sans-serif;
      }
      header { text-align: center; margin-bottom: 20px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; margin: 0; color: #536253; }
      a { color: #257039; }
      .phone {
        width: 414px;
        max-width: 100%;
        height: 868px;
        margin: 0 auto;
        border: 12px solid #17251c;
        border-radius: 38px;
        overflow: hidden;
        background: #10281b;
        box-shadow: 0 16px 40px #10281b26;
      }
      iframe { display: block; width: 100%; height: 100%; border: 0; }
    </style>
  </head>
  <body>
    <header>
      <h1>Gully Cricket · Phone Preview</h1>
      <p>Live web app at phone size · <a href="/">Open full size</a></p>
    </header>
    <main class="phone">
      <iframe src="/" title="Gully Cricket app"></iframe>
    </main>
  </body>
</html>
